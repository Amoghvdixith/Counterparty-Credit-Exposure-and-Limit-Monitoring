[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterparty-mi"
version = "0.1.0"
description = "Synthetic counterparty credit current-exposure and limit-monitoring reporting pipeline (pandas, NumPy, Matplotlib)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amogh V Dixith" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
